services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in .env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:?Set FIREBASE_SERVICE_ACCOUNT_FILE in .env}:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"
