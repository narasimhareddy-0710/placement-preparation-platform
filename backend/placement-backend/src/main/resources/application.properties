spring.application.name=placement-backend
server.port=${PORT:8080}

# Secrets are NOT stored here. Put them in a local ".env" file (git-ignored) next to pom.xml,
# or set them as environment variables. See .env.example.
spring.config.import=optional:file:.env[.properties]

# JWT: secret must be at least 32 characters. Generate one with:  openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Frontend origins allowed to call this API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
